[package]
name = "printers_sdk_flutter_rust"
version = "0.1.0"
edition = "2021"

# Standalone workspace root: this crate lives inside the printers-printing
# monorepo (which has its own [workspace] at the repo root for crates/*), but
# cargokit builds this crate independently per mobile target/toolchain, so it
# must not share that workspace's members/profile resolution.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
printers-core = { path = "../../../crates/core-rs" }
flutter_rust_bridge = "=2.12.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
