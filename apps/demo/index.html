<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Printers SDK demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Arial, sans-serif;
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
    }
    .pane { padding: 1rem; overflow: auto; }
    .pane + .pane { border-left: 1px solid #8884; }
    h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    textarea {
      width: 100%;
      height: 40vh;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      resize: vertical;
    }
    select, button {
      font-size: 14px;
      padding: 0.4rem 0.7rem;
      margin-right: 0.5rem;
    }
    .toolbar { margin: 0.75rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    #error {
      background: #fee2e2;
      color: #7f1d1d;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    #error[hidden] { display: none; }
    .preview-tabs { display: flex; gap: 0.25rem; margin-bottom: 0.5rem; }
    .preview-tabs button {
      background: none;
      border: 1px solid #8886;
      border-radius: 6px;
      cursor: pointer;
      margin: 0;
    }
    .preview-tabs button.active { background: #6366f1; color: white; border-color: #6366f1; }
    .preview-panel { display: none; }
    .preview-panel.active { display: block; }
    #html-preview { width: 100%; height: 60vh; border: 1px solid #8884; border-radius: 6px; background: white; }
    #svg-preview { border: 1px solid #8884; border-radius: 6px; padding: 0.5rem; background: #f8f8f8; }
    #svg-preview svg { max-width: 100%; }
    pre { background: #1118; padding: 0.75rem; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 60vh; }
  </style>
</head>
<body>
  <div class="pane">
    <h1>PrintDocument (docs/DOCUMENT_FORMAT.md)</h1>
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="error" hidden></div>
    <div class="toolbar">
      <button id="print-btn" disabled>Print (window.print)</button>
    </div>
  </div>
  <div class="pane">
    <h1>Preview</h1>
    <div class="preview-tabs">
      <button data-tab="html" class="active">HTML</button>
      <button data-tab="svg">SVG</button>
      <button data-tab="text">Plain text</button>
      <button data-tab="hex">ESC/POS hex</button>
    </div>
    <div class="preview-panel active" data-panel="html">
      <iframe id="html-preview" title="HTML preview"></iframe>
    </div>
    <div class="preview-panel" data-panel="svg">
      <div id="svg-preview"></div>
    </div>
    <div class="preview-panel" data-panel="text">
      <pre id="text-preview"></pre>
    </div>
    <div class="preview-panel" data-panel="hex">
      <pre id="hex-preview"></pre>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
