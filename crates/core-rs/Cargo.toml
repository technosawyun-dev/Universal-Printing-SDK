[package]
name = "printers-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PrintDocument model + renderers (ESC/POS, HTML, SVG, plain text, PDF) -- Rust twin of packages/core-ts, see docs/DOCUMENT_FORMAT.md."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
png = "0.18"
qrcode = { version = "0.14", default-features = false }
printpdf = { version = "0.12", default-features = false, features = ["png"] }
base64 = "0.22"

[dev-dependencies]
