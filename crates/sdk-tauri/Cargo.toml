[package]
name = "printers-sdk-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Example Tauri v2 plugin wrapping core-rs -- Tauri apps embed core-rs directly (no separate print-agent process), see docs/ARCHITECTURE.md."

[lib]
name = "printers_sdk_tauri"
path = "src/lib.rs"

[dependencies]
printers-core = { path = "../core-rs" }
tauri = "2"
serde_json = "1"
